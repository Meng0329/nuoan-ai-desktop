name: 鏋勫缓鎵€鏈夊钩鍙板簲鐢?
on:
  workflow_dispatch:  # 鎵嬪姩瑙﹀彂
  push:
    tags:
      - 'v*'

jobs:
  # Windows 鏋勫缓
  build-windows:
    name: 鏋勫缓 Windows 搴旂敤
    runs-on: windows-latest
    
    steps:
    - name: 妫€鍑轰唬鐮?      uses: actions/checkout@v4
    
    - name: 璁剧疆 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: 瀹夎渚濊禆
      working-directory: desktop
      run: npm install
    
    - name: 鏋勫缓 Windows 搴旂敤
      working-directory: desktop
      run: npm run build:win-no-sign-ci
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false
    
    - name: 涓婁紶 Windows 瀹夎鍖?      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: |
          desktop/dist/*.exe
          desktop/dist/latest.yml

  # macOS 鏋勫缓
  build-mac:
    name: 鏋勫缓 macOS 搴旂敤
    runs-on: macos-latest
    
    steps:
    - name: 妫€鍑轰唬鐮?      uses: actions/checkout@v4
    
    - name: 璁剧疆 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: 瀹夎渚濊禆
      working-directory: desktop
      run: npm install
    
    - name: 鏋勫缓 macOS 搴旂敤
      working-directory: desktop
      run: npm run build:mac
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false
    
    - name: 涓婁紶 macOS 瀹夎鍖?      uses: actions/upload-artifact@v4
      with:
        name: macos-dmg
        path: |
          desktop/dist/*.dmg
          desktop/dist/latest-mac.yml

  # Linux 鏋勫缓
  build-linux:
    name: 鏋勫缓 Linux 搴旂敤
    runs-on: ubuntu-latest
    
    steps:
    - name: 妫€鍑轰唬鐮?      uses: actions/checkout@v4
    
    - name: 璁剧疆 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: 瀹夎渚濊禆
      working-directory: desktop
      run: npm install
    
    - name: 鏋勫缓 Linux 搴旂敤
      working-directory: desktop
      run: npm run build:linux
    
    - name: 涓婁紶 Linux 瀹夎鍖?      uses: actions/upload-artifact@v4
      with:
        name: linux-appimage
        path: desktop/dist/*.AppImage

  # 鍒涘缓缁熶竴鐨?Release
  create-release:
    name: 鍒涘缓 Release
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: 涓嬭浇鎵€鏈夋瀯寤轰骇鐗?      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: 鏄剧ず涓嬭浇鐨勬枃浠?      run: |
        echo "涓嬭浇鐨勬瀯寤轰骇鐗?"
        find artifacts -type f
    
    - name: 鍒涘缓 GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/windows-installer/*.exe
          artifacts/macos-dmg/*.dmg
          artifacts/linux-appimage/*.AppImage
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}